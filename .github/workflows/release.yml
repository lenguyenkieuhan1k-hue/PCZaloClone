name: Build ZaloMask installer (manual)

# Không còn push tag → GitHub Release. Chỉ chạy tay (Actions → Run workflow).
# Output: artifact installer trong run đó. Phát hành qua kênh của bạn.

# Secrets tùy chọn:
# - SIGNING_CERT_BASE64 / SIGNING_CERT_PASSWORD — ký mã
# - ZALOMASK_SUPABASE_ZALO_SETUP_URL — khuyến nghị cho CI: URL public Supabase Storage tới ZaloSetup.exe
#   (upload tay một lần: Dashboard → Storage → bucket public → object URL dạng
#   https://<ref>.supabase.co/storage/v1/object/public/<bucket>/ZaloSetup.exe).
# - ZALOMASK_ZALO_SETUP_URL — mirror bất kỳ (CDN/GitHub Releases) nếu không dùng Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bundle Zalo PC runtime into app/zalo-runtime (CI)
        working-directory: ${{ github.workspace }}
        shell: powershell
        env:
          ZALOMASK_SUPABASE_ZALO_SETUP_URL: ${{ secrets.ZALOMASK_SUPABASE_ZALO_SETUP_URL }}
          ZALOMASK_ZALO_SETUP_URL: ${{ secrets.ZALOMASK_ZALO_SETUP_URL }}
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & "$env:GITHUB_WORKSPACE\scripts\setup-zalo-runtime.ps1"

      - name: Assert Chromium bootstrap (cache + spellcheck hooks)
        working-directory: app
        run: node assert-chromium-bootstrap.js

      - name: Install electron-builder
        run: npm install --no-save electron-builder@^26.8.1

      - name: Pre-patch Zalo runtime (pack)
        run: node ../scripts/patch-zalo-runtime-for-pack.js

      - name: Strip Zalo runtime junk (smaller NSIS)
        run: node ../scripts/clean-zalo-runtime-pack.js

      - name: Setup code signing certificate (if available)
        if: ${{ secrets.SIGNING_CERT_BASE64 != '' }}
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        shell: powershell
        run: |
          $certBase64 = $env:SIGNING_CERT_BASE64
          $certPath = "${{ runner.temp }}\signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($certBase64))
          echo "CSC_LINK=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CSC_KEY_PASSWORD=${{ secrets.SIGNING_CERT_PASSWORD }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build NSIS installer (--publish never)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          if ($env:SIGNING_CERT_BASE64) {
            Write-Host "Building with certificate from secrets..."
          } else {
            Write-Host "Building without signing secret..."
          }
          npx electron-builder --win nsis --x64 --publish never
        shell: powershell

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: app/dist/*.exe
          if-no-files-found: warn
